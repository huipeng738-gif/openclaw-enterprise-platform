# Start only Redis in Ubuntu Docker while the Python and Vue processes run on Windows.
# Use the same project name and volume as compose.yaml so the deployment reuses data.
name: openclaw-enterprise-platform
services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
volumes:
  redis_data:
